# Household settings that drive filtering and sorting.

home:
  label: Marine Parade
  # Approximate centre of Marine Parade town centre; good enough for sorting by
  # distance. Refine with a OneMap lookup once onemap.gov.sg is reachable.
  lat: 1.3020
  lng: 103.9060
  transport: [mrt, bus, car]

kids:
  - label: toddler
    age_years: 2 # update as they grow; the default filter is "suits this age"

planning:
  plan_day: thursday
  weekend_days: [saturday, sunday]
  include_public_holidays: true
  # Grouping of the weekend view: runs this short count as limited time;
  # longer runs count as limited ("last chance") when they end within
  # last_chance_days of the Saturday; the rest are ongoing.
  limited_max_days: 42
  last_chance_days: 14
  # Public holidays on a Friday or Monday make a long weekend; the web page adds
  # that day to the weekend. Add 2027 from the Ministry of Manpower's list.
  public_holidays:
    2026-11-09: Deepavali (observed)
    2026-12-25: Christmas Day
    2027-01-01: New Year's Day

filters:
  dietary: [] # no dietary filter
  include_paid_indoor_playgrounds: true

refresh:
  # Keep events this many days after they end, then drop them.
  keep_ended_events_days: 7
